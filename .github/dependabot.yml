# Weekly Dependabot version updates, covering every dependency surface in the
# repo: frontend npm, backend pip, CI actions, Dockerfile base images,
# docker-compose images, and Terraform providers.
#
# Runs Mondays 09:00 Asia/Colombo so PRs are ready at the start of the week;
# each is validated by the same CI jobs as any other PR (backend-test,
# frontend-checks, api-types-drift, build). Security updates are driven
# separately by the repo's Dependabot alerts/security-updates settings and are
# not limited to this schedule.

version: 2
updates:
  # frontend/ — Next.js 16 + React 19, npm with committed lockfile.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Colombo
    # ~40 direct deps; the default limit of 5 starves the tail of the list.
    open-pull-requests-limit: 10
    groups:
      # Minor/patch bumps land as one review unit per group; majors (e.g.
      # framer-motion 13→14, kubb 5→6) stay as individual PRs.
      npm-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # backend/ — FastAPI on fully pinned requirements.txt + requirements-dev.txt.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Colombo
    open-pull-requests-limit: 10
    groups:
      # 0.x minor bumps (e.g. fastapi 0.141 → 0.165) count as major here and
      # stay individual PRs, which matches how breaking their minors are.
      pip-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      pip-dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # .github/workflows — actions are version-pinned and tracked. Exception:
  # hkust-contrib/actions/*@latest refs are moving tags Dependabot cannot see;
  # pin them to a version or SHA to bring them under management.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Colombo

  # Base images (both Dockerfiles and docker-compose.yml) use floating tags
  # with no digest pin. Dependabot keeps a tag's precision, so its only
  # candidates are new runtime lines, which the ignore rules below hold back.
  # Patch releases already arrive through the floating tag at build time.
  # These entries open no PRs today. They stay configured so that pinning an
  # image (FROM image:tag@sha256:...) gets weekly digest refreshes with no
  # further config change.

  # backend/Dockerfile — python:3.12-slim.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Colombo
    ignore:
      # A new Python line (3.12 → 3.13) is a semver *minor* bump to
      # Dependabot, so ignoring majors alone would let it through. It is a
      # runtime upgrade taken deliberately, in step with CI's python-version.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # frontend/Dockerfile — node:24-alpine across all three stages.
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Colombo
    ignore:
      # Same reasoning: node 24 → 25 is a runtime decision aligned with CI's
      # node-version, not a weekly bump.
      - update-types: ["version-update:semver-major"]

  # docker-compose.yml — postgres:16-alpine. rustfs/rustfs:latest is a moving
  # tag and cannot be tracked by Dependabot at all.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Colombo
    ignore:
      # Postgres major = data-directory migration (pg_upgrade + downtime).
      # The 16-alpine tag already floats to the newest 16.x release.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  # deployment/ — Terraform providers, respecting required_providers
  # constraints in terraform.tf. carlpett/sops is exact-pinned (= 1.4.1) and
  # will not move until that pin is loosened.
  - package-ecosystem: terraform
    directory: /deployment
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Colombo
