services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haputele}
      POSTGRES_USER: ${POSTGRES_USER:-hapu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hapu}
      TZ: ${APP_TIMEZONE:-Asia/Colombo}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-hapu} -d $${POSTGRES_DB:-haputele}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # S3-compatible object store for blobs (signatures, rubber stamps, HW
  # attachments). Mirrors the prod S3 endpoint so the same code paths run
  # locally. Console at http://localhost:9001 (login with the access/secret
  # keys below). The api auto-creates the bucket on startup (see
  # services/storage.py:ensure_bucket).
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      RUSTFS_OBS_LOGGER_LEVEL: warn
      # rustfs refuses to boot with the literal default keys
      # (rustfsadmin/rustfsadmin) on a non-loopback listener — a safety
      # check meant to stop accidentally exposing a default-credentialed
      # store to a real network. Since this service only runs in local
      # dev compose (prod points S3_ENDPOINT_URL at the real S3), we
      # opt into the bypass instead of rotating the dev keys.
      RUSTFS_ALLOW_INSECURE_DEFAULT_CREDENTIALS: "true"
    volumes:
      - rustfs_data:/data
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Identity (Ory). Kratos owns accounts, passwords and the login/recovery
  # flows; Hydra is the OIDC provider the app signs in through. Both keep
  # their state in their own database in the `db` Postgres. Config lives in
  # ./ory (dev values only). The public APIs are on localhost:4433 (Kratos)
  # and localhost:4444 (Hydra); the admin APIs are on 4434 and 4445 and are
  # bound to loopback for local debugging only. The host ports are fixed
  # because the ory/*.yml URLs (and the frontend's localhost:3000) name them.
  ory-db-init:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-hapu}
      PGPASSWORD: ${POSTGRES_PASSWORD:-hapu}
      PGDATABASE: ${POSTGRES_DB:-haputele}
    volumes:
      - ./ory/postgres/create-databases.sh:/create-databases.sh:ro
    command: ["sh", "/create-databases.sh"]
    depends_on:
      db:
        condition: service_healthy

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    environment:
      DSN: postgres://${POSTGRES_USER:-hapu}:${POSTGRES_PASSWORD:-hapu}@db:5432/kratos?sslmode=disable
    command: ["migrate", "sql", "--read-from-env", "--yes"]
    depends_on:
      ory-db-init:
        condition: service_completed_successfully

  kratos:
    image: oryd/kratos:v26.2.0
    restart: unless-stopped
    environment:
      DSN: postgres://${POSTGRES_USER:-hapu}:${POSTGRES_PASSWORD:-hapu}@db:5432/kratos?sslmode=disable
    # --dev allows plain-HTTP cookies on localhost; --watch-courier runs the
    # mail sender in-process (it must be a singleton).
    command: ["serve", "--config", "/etc/config/kratos/kratos.yml", "--dev", "--watch-courier"]
    volumes:
      - ./ory/kratos:/etc/config/kratos:ro
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4434/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:4433:4433"
      - "127.0.0.1:4434:4434"

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    environment:
      DSN: postgres://${POSTGRES_USER:-hapu}:${POSTGRES_PASSWORD:-hapu}@db:5432/hydra?sslmode=disable
    command: ["migrate", "sql", "--read-from-env", "--yes"]
    depends_on:
      ory-db-init:
        condition: service_completed_successfully

  hydra:
    image: oryd/hydra:v26.2.0
    restart: unless-stopped
    environment:
      DSN: postgres://${POSTGRES_USER:-hapu}:${POSTGRES_PASSWORD:-hapu}@db:5432/hydra?sslmode=disable
    # --dev allows a plain-HTTP issuer on localhost.
    command: ["serve", "all", "--config", "/etc/config/hydra/hydra.yml", "--dev"]
    volumes:
      - ./ory/hydra:/etc/config/hydra:ro
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4445/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:4445:4445"

  # Catches Kratos courier mail (recovery and verification codes) in dev.
  # Inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # For local Docker video calls, run scripts/local-livekit (see README).

  api:
    build:
      context: ./backend
      args:
        # Image provenance surfaced by GET /health. CI bakes in the git ref,
        # sha, and build timestamp; local builds use the dev markers.
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-hapu}:${POSTGRES_PASSWORD:-hapu}@db:5432/${POSTGRES_DB:-haputele}
      DB_HOST: db
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_EXPIRE_MIN: ${JWT_EXPIRE_MIN:-480}
      MASTER_CONSENT_VERSION: ${MASTER_CONSENT_VERSION:-v1}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Colombo}
      TZ: ${APP_TIMEZONE:-Asia/Colombo}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # Object storage. In compose the api talks to rustfs over the
      # internal network (http://rustfs:9000); override S3_ENDPOINT_URL to
      # point at real S3 in prod. S3_FORCE_PATH_STYLE must stay true for
      # rustfs/minio/most non-AWS endpoints.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://rustfs:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-haputele}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      DOCTOR_INVITE_TTL_HOURS: ${DOCTOR_INVITE_TTL_HOURS:-72}
    volumes:
      # Persists the plaintext setup-token file across container restarts.
      # `docker compose down -v` clears it (same volume lifecycle as db_data).
      - api_data:/data
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* must be present at build time — Next inlines them into
        # the client bundle. Empty here means the client uses the relative
        # "/api" prefix and Next.js's rewrite proxies to the api container,
        # so the bundle works on any hostname (localhost, LAN, tunnel, prod).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
        NEXT_PUBLIC_APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Colombo}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
      NEXT_PUBLIC_APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Colombo}
      TZ: ${APP_TIMEZONE:-Asia/Colombo}
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  db_data:
  api_data:
  rustfs_data:
